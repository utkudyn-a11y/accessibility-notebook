name: Build and accessibility test
on:
  push:
  pull_request:
jobs:
  test:
    # Pinned: Playwright 1.55 cannot install Chromium on ubuntu-latest (26.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:a11y
